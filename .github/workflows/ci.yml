name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_API_URL: https://ppm-dev-func-x32hrp.azurewebsites.net/api
  NEXT_PUBLIC_APP_ENV: development
  NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID: dev-household

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: portfolio-web

      - uses: actions/checkout@v4
        with:
          repository: Dilipmukkapati1/portfolio-contracts
          path: portfolio-contracts

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio-web/package-lock.json

      - run: npm ci
        working-directory: portfolio-web

      - run: npm run lint
        working-directory: portfolio-web

      - run: npm test
        working-directory: portfolio-web

      - run: npm run build
        working-directory: portfolio-web
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_ENV: ${{ env.NEXT_PUBLIC_APP_ENV }}
          NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID: ${{ env.NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          path: portfolio-web

      - uses: actions/checkout@v4
        with:
          repository: Dilipmukkapati1/portfolio-contracts
          path: portfolio-contracts

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio-web/package-lock.json

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: portfolio-web
          api_location: ""
          output_location: ""
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_ENV: ${{ env.NEXT_PUBLIC_APP_ENV }}
          NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID: ${{ env.NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID }}
