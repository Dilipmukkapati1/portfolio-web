name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_API_URL: https://ppm-dev-func-x32hrp.azurewebsites.net/api
  NEXT_PUBLIC_APP_ENV: development
  NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID: dev-household

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: portfolio-web

      - uses: actions/checkout@v4
        with:
          repository: Dilipmukkapati1/portfolio-contracts
          path: portfolio-contracts

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio-web/package-lock.json

      - name: Build portfolio-contracts
        run: npm ci && npm run build
        working-directory: portfolio-contracts

      - name: Install and verify web
        working-directory: portfolio-web
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_ENV: ${{ env.NEXT_PUBLIC_APP_ENV }}
          NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID: ${{ env.NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID }}

      - name: Vendor portfolio-contracts for SWA packaging
        working-directory: portfolio-web
        run: |
          rm -rf node_modules/@portfolio/contracts
          cp -R ../portfolio-contracts node_modules/@portfolio/contracts

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-deploy
          path: portfolio-web
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-deploy
          path: portfolio-web

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: portfolio-web
          api_location: ""
          output_location: ""
          skip_app_build: true
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_ENV: ${{ env.NEXT_PUBLIC_APP_ENV }}
          NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID: ${{ env.NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID }}
