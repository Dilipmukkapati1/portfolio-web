name: Deploy prod

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-prod]

concurrency:
  group: deploy-prod-web
  cancel-in-progress: true

env:
  CHECKOUT_REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build for Azure prod
        env:
          FUNCTION_APP_BASE_URL: ${{ vars.FUNCTION_APP_BASE_URL }}
        run: |
          api_base="${FUNCTION_APP_BASE_URL:-https://ppm-prod-func-x32hrp.azurewebsites.net}"
          export NEXT_PUBLIC_API_URL="${api_base%/}/api"
          export NEXT_PUBLIC_APP_ENV=production
          export NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID=prod-household
          echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
          npm ci
          npm run build
          test -d .next/standalone

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: ""
          output_location: ""
          skip_app_build: true
