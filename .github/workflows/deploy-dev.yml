name: Deploy dev

on:
  push:
    branches: [develop]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-dev]

concurrency:
  group: deploy-dev-web
  cancel-in-progress: true

env:
  CHECKOUT_REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build for Azure dev
        env:
          FUNCTION_APP_BASE_URL: ${{ vars.FUNCTION_APP_BASE_URL }}
        run: |
          api_base="${FUNCTION_APP_BASE_URL:-https://ppm-dev-func-x32hrp.azurewebsites.net}"
          export NEXT_PUBLIC_API_URL="${api_base%/}/api"
          export NEXT_PUBLIC_APP_ENV=development
          export NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID=dev-household
          echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
          npm ci
          npm run build

      - name: Deploy Static Web App
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          FUNCTION_APP_BASE_URL: ${{ vars.FUNCTION_APP_BASE_URL }}
        run: |
          api_base="${FUNCTION_APP_BASE_URL:-https://ppm-dev-func-x32hrp.azurewebsites.net}"
          export NEXT_PUBLIC_API_URL="${api_base%/}/api"
          export NEXT_PUBLIC_APP_ENV=development
          export NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID=dev-household
          rm -rf .next .swa-deploy
          npx --yes @azure/static-web-apps-cli deploy \
            --config swa-cli.config.json \
            --env production \
            --deployment-token "$SWA_DEPLOYMENT_TOKEN"
