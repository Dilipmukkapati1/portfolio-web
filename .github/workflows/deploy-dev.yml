name: Deploy dev

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-dev]

concurrency:
  group: deploy-dev-web
  cancel-in-progress: true

env:
  CHECKOUT_REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.ref }}
  LIB_REF: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          path: portfolio-web
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/checkout@v4
        with:
          repository: Dilipmukkapati1/portfolio-contracts
          path: portfolio-contracts
          ref: ${{ env.LIB_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build for Azure dev
        working-directory: portfolio-web
        env:
          FUNCTION_APP_BASE_URL: ${{ vars.FUNCTION_APP_BASE_URL }}
          DEV_FUNCTION_APP_URL: ${{ vars.DEV_FUNCTION_APP_URL }}
        run: |
          api_base="${FUNCTION_APP_BASE_URL:-${DEV_FUNCTION_APP_URL:-https://ppm-dev-func-x32hrp.azurewebsites.net}}"
          export NEXT_PUBLIC_API_URL="${api_base%/}/api"
          export NEXT_PUBLIC_APP_ENV=development
          export NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID=dev-household
          echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
          if echo "$NEXT_PUBLIC_API_URL" | grep -q "ppm-prod-func"; then
            echo "::error::Dev deploy must not target prod Function App ($NEXT_PUBLIC_API_URL)"
            exit 1
          fi
          # Build the file: contracts dependency before installing the web app
          # so npm ci copies its freshly built dist.
          cd ../portfolio-contracts && npm ci && npm run build
          cd ../portfolio-web && npm ci && npm run build
          test -d .next/standalone

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: portfolio-web
          api_location: ""
          output_location: ""
          skip_app_build: true
