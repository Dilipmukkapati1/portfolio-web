name: Deploy dev

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-dev]

concurrency:
  group: deploy-dev-web
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APP_ENV: development
  NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID: dev-household

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Resolve dev API URL
        id: api
        run: |
          base="${{ vars.DEV_FUNCTION_APP_URL }}"
          if [ -z "$base" ]; then
            echo "::warning::DEV_FUNCTION_APP_URL is unset; using ppm-dev-func-x32hrp"
            base="https://ppm-dev-func-x32hrp.azurewebsites.net"
          fi
          echo "url=${base%/}/api" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: ""
          output_location: ""
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.api.outputs.url }}
          NEXT_PUBLIC_APP_ENV: ${{ env.NEXT_PUBLIC_APP_ENV }}
          NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID: ${{ env.NEXT_PUBLIC_DEFAULT_HOUSEHOLD_ID }}
